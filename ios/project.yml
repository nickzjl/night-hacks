name: NightHacks
options:
  bundleIdPrefix: com.nickzjl
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: A5HQBJWTL4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NightHacks:
    type: application
    platform: iOS
    sources:
      - NightHacks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickzjl.nighthacks
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Night Hacks
        INFOPLIST_KEY_NSCameraUsageDescription: The camera and LiDAR see obstacles and objects in front of you.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Sends camera frames to the Night Hacks Mac for recognition and Braille output.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Talks to the Night Hacks Mac over Bluetooth when Wi-Fi can't reach it.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: NightHacks/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NHDefaultHost: "$(NH_DEFAULT_HOST)"
